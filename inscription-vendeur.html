<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inscription Vendeur - VotreMarché</title>
    <meta name="description" content="Remplissez ce formulaire pour créer votre compte vendeur sur VotreMarché, Congo-Brazzaville." />
    <link rel="icon" type="image/png" href="src/img/logo.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vm-primary': '#4a634e',
                        'vm-accent': '#f2c335',
                        'vm-centre': '#304870',
                    },
                },
            },
        };
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 1px 1px, #334155 1px, transparent 0);
            background-size: 20px 20px;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #4F46E5;
            color: white;
            padding: 8px;
            z-index: 100;
            transition: top 0.3s;
        }
        .skip-link:focus {
            top: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans leading-normal tracking-normal">

<a href="#main-content" class="skip-link">Aller au contenu principal</a>


<!-- MAIN FORM -->
<main id="main-content" class="max-w-lg mx-auto px-4 py-12">
  <div class="bg-slate-800/60 backdrop-blur-md p-8 rounded-lg shadow-lg">
    <div class="flex flex-col items-center mb-6">
      <img
        src="src/img/logo.jpg"
        alt="Logo VotreMarché"
        class="h-20 w-20 rounded-full"
        loading="eager"
      />
      <h1 class="text-3xl font-bold mt-4">Inscription Vendeur</h1>
    </div>

    <form action="/register-seller" method="POST" enctype="multipart/form-data" class="space-y-5 text-white">
      <div>
        <label for="company_name" class="block mb-1 font-medium">Nom de votre entreprise/boutique</label>
        <input
          type="text"
          id="company_name"
          name="company_name"
          required
          autofocus
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="seller_name" class="block mb-1 font-medium">Nom complet du contact</label>
        <input
          type="text"
          id="seller_name"
          name="seller_name"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="email" class="block mb-1 font-medium">Adresse Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="phone" class="block mb-1 font-medium">Numéro de téléphone</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="address" class="block mb-1 font-medium">Adresse de l'entreprise</label>
        <textarea
          id="address"
          name="address"
          rows="3"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent resize-none"
        ></textarea>
      </div>

      <div>
        <label for="business_type" class="block mb-1 font-medium">Type d'activité</label>
        <select
          id="business_type"
          name="business_type"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        >
          <option value="">Sélectionnez votre type d'activité</option>
          <option value="retail">Commerce de détail</option>
          <option value="wholesale">Commerce de gros</option>
          <option value="manufacturing">Fabrication</option>
          <option value="services">Services</option>
          <option value="other">Autre</option>
        </select>
      </div>

      <div>
        <label for="tax_id" class="block mb-1 font-medium">Numéro d'identification fiscale (optionnel)</label>
        <input
          type="text"
          id="tax_id"
          name="tax_id"
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="business_license" class="block mb-1 font-medium">Licence commerciale (si applicable)</label>
        <input
          type="file"
          id="business_license"
          name="business_license"
          accept=".pdf,.jpg,.jpeg,.png"
          class="w-full text-white"
        />
        <p class="text-sm text-slate-400 mt-1">Formats acceptés : PDF, JPG, PNG (max 5MB)</p>
      </div>

      <div>
        <label for="password" class="block mb-1 font-medium">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="new-password"
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
        <div id="pwd-hints-v" class="mt-2 text-xs space-y-1">
          <span id="v-len"   class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 8 caractères minimum</span>
          <span id="v-upper" class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 lettre majuscule</span>
          <span id="v-lower" class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 lettre minuscule</span>
          <span id="v-digit" class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 chiffre</span>
          <span id="v-spec"  class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 caractère spécial (!@#$%...)</span>
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block mb-1 font-medium">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          required
          autocomplete="new-password"
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div class="flex items-center gap-2">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          required
          class="form-checkbox accent-vm-accent"
        />
        <label for="terms" class="text-sm">
          J'accepte les
          <a href="conditions.html" class="text-vm-accent hover:underline">conditions générales</a>
          et la
          <a href="confidentialite.html" class="text-vm-accent hover:underline">politique de confidentialité</a>
        </label>
      </div>

      <button
        type="submit"
        class="w-full py-2 bg-vm-accent text-black rounded-lg font-semibold hover:scale-105 transition"
      >
        Créer mon compte vendeur
      </button>
    </form>

    <div class="mt-6 text-center text-slate-400 space-y-2">
      <p>
        Déjà un compte ?
        <a href="connexion.html" class="text-vm-accent hover:underline">Se connecter</a>
      </p>
      <p>
        Vous êtes un acheteur ?
        <a href="inscription.html" class="text-vm-accent hover:underline">Inscrivez-vous ici !</a>
      </p>
    </div>
  </div>
</main>

<script src="js/layout.js"></script>
<script src="js/script.js"></script>
<script>
(function() {
    const checks = {
        'v-len':   p => p.length >= 8,
        'v-upper': p => /[A-Z]/.test(p),
        'v-lower': p => /[a-z]/.test(p),
        'v-digit': p => /[0-9]/.test(p),
        'v-spec':  p => /[!@#$%^&*\-_=+;:,.<>?]/.test(p),
    };
    const input = document.getElementById('password');
    if (!input) return;
    input.addEventListener('input', () => {
        const v = input.value;
        for (const [id, fn] of Object.entries(checks)) {
            const el = document.getElementById(id);
            if (!el) continue;
            if (fn(v)) {
                el.className = 'flex items-center gap-1 text-green-400';
                el.querySelector('i').className = 'fas fa-check-circle text-[8px]';
            } else {
                el.className = 'flex items-center gap-1 text-red-400';
                el.querySelector('i').className = 'fas fa-times-circle text-[8px]';
            }
        }
    });
})();
</script>
</body>
</html>
