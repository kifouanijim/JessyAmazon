<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Panier - VotreMarché</title>
    <meta name="description" content="Gérez les articles de votre panier avant de commander sur VotreMarché, Congo-Brazzaville.">
    <link rel="stylesheet" href="css/modern-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="src/img/logo.jpg">
</head>
  
<body>
    <a href="#main-content" class="skip-link">
        Aller au contenu principal
    </a>


    <main id="main-content" class="cart-main">
        <div class="container">
            <h1 class="cart-title">Votre Panier</h1>

            <div class="cart-grid">
                <!-- Articles du panier (chargés dynamiquement par script.js) -->
                <div class="cart-items">
                    <!-- Le contenu est injecté par PanierPage dans script.js -->
                </div>

                <!-- Résumé de la commande -->
                <div class="cart-summary">
                    <div class="summary-card">
                        <h2 class="summary-title">Résumé de la commande</h2>
                        
                        <div class="summary-items">
                            <div class="summary-item">
                                <span>Sous-total</span>
                                <span>0 FCFA</span>
                            </div>
                            <div class="summary-item">
                                <span>Livraison</span>
                                <span>2 500 FCFA</span>
                            </div>
                            <div class="summary-item summary-total">
                                <span>Total</span>
                                <span>0 FCFA</span>
                            </div>
                        </div>
                        
                        <div class="summary-actions">
                            <a href="paiement.html" class="btn btn-primary btn-full">
                                Procéder au paiement
                            </a>
                            <a href="categories.html" class="btn btn-outline btn-full">
                                Continuer les achats
                            </a>
                        </div>
                        
                        <div class="payment-methods-summary">
                            <h3 class="payment-methods-title">Moyens de paiement acceptés</h3>
                            <div class="payment-methods-grid">
                                <img src="src/img/airtel.png" alt="Airtel Money" class="payment-method-icon">
                                <img src="src/img/mtn.png" alt="MTN Mobile Money" class="payment-method-icon">
                                <img src="src/img/visa.png" alt="Visa" class="payment-method-icon">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
