<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - VotreMarché</title>

    <!-- Meta SEO -->
    <meta name="description" content="Connectez-vous à votre compte VotreMarché pour gérer vos commandes ou votre boutique.">
    <meta name="theme-color" content="#4F46E5">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Connexion - VotreMarché">
    <meta property="og:description" content="Connectez-vous pour gérer vos commandes et votre boutique.">
    <meta property="og:image" content="src/img/logo.jpg">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="src/img/logo.jpg">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vm-primary': '#4a634e',
                        'vm-accent': '#f2c335',
                        'vm-centre': '#304870',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 1px 1px, #334155 1px, transparent 0);
            background-size: 20px 20px;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #4F46E5;
            color: white;
            padding: 8px;
            z-index: 100;
            transition: top 0.3s;
        }
        .skip-link:focus { top: 0; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans leading-normal tracking-normal">

<a href="#main-content" class="skip-link">Aller au contenu principal</a>


<!-- MAIN -->
<main id="main-content" class="max-w-lg mx-auto px-4 py-12">
    <div class="bg-slate-800/60 backdrop-blur-md p-8 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold mb-6 text-center">Connectez-vous</h1>

        <!-- Formulaire -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label for="email_phone" class="block text-sm font-medium mb-1">Email ou Numéro de téléphone</label>
                <input type="text" id="email_phone" name="email_phone" required autofocus
                       class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent">
            </div>

            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="form-checkbox accent-vm-accent">
                    Se souvenir de moi
                </label>
                <a href="mot-de-passe-oublie.html" class="text-vm-accent hover:underline">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="w-full py-2 bg-vm-accent text-black rounded-lg font-semibold hover:scale-105 transition">
                Se connecter
            </button>
        </form>

        <!-- Ou -->
        <div class="relative my-6">
            <span class="absolute inset-x-0 top-1/2 border-t border-slate-600"></span>
            <span class="relative px-2 bg-slate-800 text-slate-400 text-sm">ou</span>
        </div>

        <!-- Boutons sociaux -->
        <div class="space-y-3">
            <button type="button" class="w-full py-2 bg-red-600 rounded-lg flex items-center justify-center gap-2 hover:opacity-90">
                <i class="fab fa-google"></i> Continuer avec Google
            </button>
            <button type="button" class="w-full py-2 bg-blue-600 rounded-lg flex items-center justify-center gap-2 hover:opacity-90">
                <i class="fab fa-facebook-f"></i> Continuer avec Facebook
            </button>
        </div>

        <!-- Inscription -->
        <p class="text-center text-slate-400 mt-6">
            Pas encore de compte ? <a href="inscription.html" class="text-vm-accent hover:underline">S'inscrire</a>
        </p>
    </div>
</main>

<script src="js/layout.js"></script>
<script src="js/script.js"></script>
</body>
</html>
