<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - VotreMarché</title>
    <meta name="description" content="Parcourez nos produits par catégorie sur VotreMarché, Congo-Brazzaville.">
    <link rel="icon" type="image/png" href="src/img/logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vm-primary': '#4a634e',
                        'vm-accent': '#f2c335',
                        'vm-centre': '#304870',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 1px 1px, #334155 1px, transparent 0);
            background-size: 20px 20px;
        }
        .skip-link { position: absolute; top: -40px; left: 0; background: #4F46E5; color: white; padding: 8px; z-index: 100; transition: top 0.3s; }
        .skip-link:focus { top: 0; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

<a href="#main-content" class="skip-link">Aller au contenu principal</a>


<!-- MAIN -->
<main id="main-content" class="max-w-6xl mx-auto px-4 py-8">

    <!-- Breadcrumb -->
    <nav class="text-sm text-slate-400 mb-6 flex items-center gap-2">
        <a href="index.html" class="hover:text-vm-accent">Accueil</a>
        <i class="fas fa-chevron-right text-xs"></i>
        <a href="categories.html" class="hover:text-vm-accent">Catégories</a>
        <i class="fas fa-chevron-right text-xs"></i>
        <span class="text-white" id="breadcrumb-cat">Produits</span>
    </nav>

    <!-- Titre + tri -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
            <h1 id="page-title" class="text-3xl font-bold text-white">Produits</h1>
            <p id="product-count" class="text-slate-400 mt-1 text-sm"></p>
        </div>
        <div class="flex items-center gap-3">
            <label for="sort-select" class="text-slate-400 text-sm">Trier par :</label>
            <select id="sort-select" class="px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm focus:outline-none focus:border-vm-accent">
                <option value="default">Popularité</option>
                <option value="price-asc">Prix croissant</option>
                <option value="price-desc">Prix décroissant</option>
                <option value="rating">Meilleures notes</option>
            </select>
        </div>
    </div>

    <!-- Grille de produits -->
    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
        <!-- Rempli dynamiquement par script.js -->
        <div class="col-span-full flex items-center justify-center py-16">
            <div class="flex flex-col items-center gap-4 text-slate-400">
                <i class="fas fa-spinner fa-spin text-4xl text-vm-accent"></i>
                <p>Chargement des produits...</p>
            </div>
        </div>
    </div>

    <!-- Catégories suggérées -->
    <section class="mt-16">
        <h2 class="text-xl font-semibold mb-6">Autres catégories</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <a href="liste-produits.html?cat=electronique" class="flex items-center gap-3 p-4 bg-slate-800/50 border border-slate-700 rounded-lg hover:border-vm-accent transition">
                <i class="fas fa-laptop text-vm-accent text-xl"></i>
                <span class="text-sm font-medium">Électronique</span>
            </a>
            <a href="liste-produits.html?cat=alimentation" class="flex items-center gap-3 p-4 bg-slate-800/50 border border-slate-700 rounded-lg hover:border-vm-accent transition">
                <i class="fas fa-apple-alt text-vm-accent text-xl"></i>
                <span class="text-sm font-medium">Alimentation</span>
            </a>
            <a href="liste-produits.html?cat=mode" class="flex items-center gap-3 p-4 bg-slate-800/50 border border-slate-700 rounded-lg hover:border-vm-accent transition">
                <i class="fas fa-tshirt text-vm-accent text-xl"></i>
                <span class="text-sm font-medium">Mode</span>
            </a>
            <a href="liste-produits.html?cat=maison" class="flex items-center gap-3 p-4 bg-slate-800/50 border border-slate-700 rounded-lg hover:border-vm-accent transition">
                <i class="fas fa-home text-vm-accent text-xl"></i>
                <span class="text-sm font-medium">Maison & Jardin</span>
            </a>
        </div>
    </section>
</main>

<script src="js/layout.js"></script>
<script src="js/script.js"></script>
</body>
</html>
