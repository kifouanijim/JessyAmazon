<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S'inscrire - VotreMarché</title>
  <meta
    name="description"
    content="Créez un compte acheteur sur VotreMarché pour profiter de nos produits et services au Congo-Brazzaville."
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'vm-primary': '#4a634e',
            'vm-accent': '#f2c335',
            'vm-centre': '#304870',
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #0f172a;
      background-image: radial-gradient(circle at 1px 1px, #334155 1px, transparent 0);
      background-size: 20px 20px;
    }
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #4f46e5;
      color: white;
      padding: 8px;
      z-index: 100;
      transition: top 0.3s;
    }
    .skip-link:focus {
      top: 0;
    }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans leading-normal tracking-normal">

<a href="#main-content" class="skip-link">Aller au contenu principal</a>


<!-- MAIN FORM -->
<main id="main-content" class="max-w-lg mx-auto px-4 py-12">
  <div class="bg-slate-800/60 backdrop-blur-md p-8 rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold mb-8 text-center">Créer un Compte Acheteur</h1>

    <form action="/register-buyer" method="POST" class="space-y-5 text-white">
      <div>
        <label for="full_name" class="block mb-1 font-medium">Nom complet</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          required
          autofocus
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="email" class="block mb-1 font-medium">Adresse Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="phone" class="block mb-1 font-medium">Numéro de téléphone</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="password" class="block mb-1 font-medium">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="new-password"
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
        <div id="pwd-hints" class="mt-2 text-xs space-y-1">
          <span id="h-len"  class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 8 caractères minimum</span>
          <span id="h-upper" class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 lettre majuscule</span>
          <span id="h-lower" class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 lettre minuscule</span>
          <span id="h-digit" class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 chiffre</span>
          <span id="h-spec"  class="flex items-center gap-1 text-slate-400"><i class="fas fa-circle text-[8px]"></i> 1 caractère spécial (!@#$%...)</span>
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block mb-1 font-medium">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          required
          autocomplete="new-password"
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent"
        />
      </div>

      <div>
        <label for="address" class="block mb-1 font-medium">Adresse de livraison</label>
        <textarea
          id="address"
          name="address"
          rows="3"
          required
          class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-vm-accent resize-none"
        ></textarea>
      </div>

      <div class="flex items-center gap-2">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          required
          class="form-checkbox accent-vm-accent"
        />
        <label for="terms" class="text-sm">
          J'accepte les
          <a href="conditions.html" class="text-vm-accent hover:underline">conditions générales</a> et la
          <a href="confidentialite.html" class="text-vm-accent hover:underline">politique de confidentialité</a>
        </label>
      </div>

      <button
        type="submit"
        class="w-full py-2 bg-vm-accent text-black rounded-lg font-semibold hover:scale-105 transition"
      >
        Créer mon compte
      </button>
    </form>

    <div class="mt-6 text-center text-slate-400 space-y-2">
      <p>
        Déjà un compte ?
        <a href="connexion.html" class="text-vm-accent hover:underline">Se connecter</a>
      </p>
      <p>
        Vous êtes un vendeur ?
        <a href="inscription-vendeur.html" class="text-vm-accent hover:underline">Inscrivez-vous ici !</a>
      </p>
    </div>

    <div class="mt-8 flex flex-col gap-4">
      <button
        type="button"
        class="w-full py-2 rounded-lg bg-red-600 hover:bg-red-700 flex justify-center items-center gap-2 font-semibold"
      >
        <i class="fab fa-google"></i> Continuer avec Google
      </button>
      <button
        type="button"
        class="w-full py-2 rounded-lg bg-blue-700 hover:bg-blue-800 flex justify-center items-center gap-2 font-semibold"
      >
        <i class="fab fa-facebook-f"></i> Continuer avec Facebook
      </button>
    </div>
  </div>
</main>

<script src="js/layout.js"></script>
<script src="js/script.js"></script>
<script>
(function() {
    const checks = {
        'h-len':   p => p.length >= 8,
        'h-upper': p => /[A-Z]/.test(p),
        'h-lower': p => /[a-z]/.test(p),
        'h-digit': p => /[0-9]/.test(p),
        'h-spec':  p => /[!@#$%^&*\-_=+;:,.<>?]/.test(p),
    };
    const input = document.getElementById('password');
    if (!input) return;
    input.addEventListener('input', () => {
        const v = input.value;
        for (const [id, fn] of Object.entries(checks)) {
            const el = document.getElementById(id);
            if (!el) continue;
            if (fn(v)) {
                el.className = 'flex items-center gap-1 text-green-400';
                el.querySelector('i').className = 'fas fa-check-circle text-[8px]';
            } else {
                el.className = 'flex items-center gap-1 text-red-400';
                el.querySelector('i').className = 'fas fa-times-circle text-[8px]';
            }
        }
    });
})();
</script>
</body>
</html>
